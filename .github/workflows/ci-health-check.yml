name: CI Health Check

on:
  # Run daily at 1 AM UTC
  schedule:
    - cron: '0 1 * * *'
  
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    name: CI Pipeline Health Check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov requests
      
      - name: Create health check artifacts directory
        run: mkdir -p ci_artifacts/health_check
      
      - name: Check workflow files integrity
        run: |
          echo "Checking workflow files integrity..."
          
          # Check if workflow files exist and are valid YAML
          python -c """
          import yaml
          import os
          import sys
          
          error_count = 0
          workflows_dir = '.github/workflows'
          
          if not os.path.exists(workflows_dir):
              print(f'Error: {workflows_dir} directory not found')
              sys.exit(1)
          
          for filename in os.listdir(workflows_dir):
              if filename.endswith('.yml') or filename.endswith('.yaml'):
                  file_path = os.path.join(workflows_dir, filename)
                  try:
                      with open(file_path, 'r') as f:
                          yaml.safe_load(f)
                      print(f'✓ {filename} is valid')
                  except yaml.YAMLError as e:
                      print(f'✗ {filename} is invalid: {str(e)}')
                      error_count += 1
          
          print(f'Checked {len(os.listdir(workflows_dir))} workflow files')
          print(f'Found {error_count} errors')
          
          # Write summary for artifact
          with open('ci_artifacts/health_check/workflow_check.md', 'w') as f:
              f.write('# Workflow Files Check\n\n')
              f.write(f'Checked {len(os.listdir(workflows_dir))} workflow files\n\n')
              f.write(f'Found {error_count} errors\n')
          
          if error_count > 0:
              sys.exit(1)
          """
      
      - name: Check workflow scripts
        run: |
          echo "Checking workflow scripts..."
          
          # Check if script files exist and have execution permission
          python -c """
          import os
          import stat
          import sys
          
          scripts_dir = '.github/workflows/scripts'
          
          if not os.path.exists(scripts_dir):
              print(f'Error: {scripts_dir} directory not found')
              sys.exit(1)
          
          error_count = 0
          permission_errors = 0
          
          for filename in os.listdir(scripts_dir):
              file_path = os.path.join(scripts_dir, filename)
              
              # Skip directories
              if os.path.isdir(file_path):
                  continue
              
              # Check if file exists
              if not os.path.isfile(file_path):
                  print(f'✗ {filename} is not a file')
                  error_count += 1
                  continue
              
              # Check for execution permission
              if filename.endswith('.sh') or filename.endswith('.py'):
                  file_stat = os.stat(file_path)
                  if not (file_stat.st_mode & stat.S_IXUSR):
                      print(f'✗ {filename} does not have execution permission')
                      permission_errors += 1
                  else:
                      print(f'✓ {filename} has execution permission')
          
          print(f'Checked {len(os.listdir(scripts_dir))} script files')
          print(f'Found {error_count} errors and {permission_errors} permission issues')
          
          # Write summary for artifact
          with open('ci_artifacts/health_check/scripts_check.md', 'w') as f:
              f.write('# Workflow Scripts Check\n\n')
              f.write(f'Checked {len(os.listdir(scripts_dir))} script files\n\n')
              f.write(f'Found {error_count} errors and {permission_errors} permission issues\n')
          
          if error_count > 0:
              sys.exit(1)
          """
      
      - name: Verify external dependencies
        run: |
          echo "Verifying external dependencies..."
          
          # Create a script to check external service health
          cat > check_external.py << EOF
          import requests
          import sys
          import json
          
          # List of external services to check
          services = [
              {"name": "GitHub API", "url": "https://api.github.com/status", "expected_status": 200},
              {"name": "PyPI", "url": "https://pypi.org/simple/pip/", "expected_status": 200},
              {"name": "Shields.io", "url": "https://img.shields.io/badge/test-passing-brightgreen", "expected_status": 200}
          ]
          
          results = []
          failure_count = 0
          
          for service in services:
              try:
                  response = requests.get(service["url"], timeout=10)
                  status = response.status_code
                  success = status == service["expected_status"]
                  
                  if not success:
                      failure_count += 1
                  
                  results.append({
                      "name": service["name"],
                      "url": service["url"],
                      "expected_status": service["expected_status"],
                      "actual_status": status,
                      "success": success
                  })
                  
                  print(f"{'✓' if success else '✗'} {service['name']}: {'OK' if success else 'FAILED'} ({status})")
                  
              except Exception as e:
                  failure_count += 1
                  results.append({
                      "name": service["name"],
                      "url": service["url"],
                      "expected_status": service["expected_status"],
                      "actual_status": None,
                      "success": False,
                      "error": str(e)
                  })
                  print(f"✗ {service['name']}: ERROR ({str(e)})")
          
          # Write results to file
          with open('ci_artifacts/health_check/external_services.json', 'w') as f:
              json.dump(results, f, indent=2)
          
          # Write summary for artifact
          with open('ci_artifacts/health_check/external_services.md', 'w') as f:
              f.write('# External Services Check\n\n')
              f.write(f'Checked {len(services)} external services\n\n')
              f.write(f'Found {failure_count} failures\n\n')
              
              f.write('| Service | Status | Result |\n')
              f.write('|---------|--------|--------|\n')
              
              for result in results:
                  status = result.get('actual_status') or 'ERROR'
                  success_str = '✅ OK' if result['success'] else '❌ FAILED'
                  f.write(f"| {result['name']} | {status} | {success_str} |\n")
          
          if failure_count > 0:
              sys.exit(1)
          EOF
          
          # Run the check
          python check_external.py || echo "External dependency check failed"
      
      - name: Run minimal tests
        run: |
          echo "Running minimal test suite to verify test infrastructure..."
          
          # Create a simple test file
          mkdir -p tests
          cat > tests/test_ci_health.py << EOF
          import unittest
          import os
          import sys
          
          class TestCIHealth(unittest.TestCase):
              def test_python_version(self):
                  """Verify Python version is correct."""
                  version_info = sys.version_info
                  self.assertEqual(version_info.major, 3)
                  self.assertGreaterEqual(version_info.minor, 9)
              
              def test_environment_variables(self):
                  """Verify essential environment variables are set."""
                  self.assertIn('GITHUB_WORKFLOW', os.environ)
                  self.assertIn('GITHUB_WORKSPACE', os.environ)
                  self.assertIn('GITHUB_RUN_ID', os.environ)
              
              def test_filesystem_access(self):
                  """Verify file system access works."""
                  test_file = "ci_health_test.txt"
                  test_content = "CI Health Check"
                  
                  # Write to file
                  with open(test_file, "w") as f:
                      f.write(test_content)
                  
                  # Read from file
                  with open(test_file, "r") as f:
                      content = f.read()
                  
                  self.assertEqual(content, test_content)
                  
                  # Clean up
                  os.remove(test_file)
              
              def test_dependency_import(self):
                  """Verify that dependencies can be imported."""
                  import pytest
                  import requests
          
          if __name__ == '__main__':
              unittest.main()
          EOF
          
          # Run tests and generate coverage report
          python -m pytest tests/test_ci_health.py -v --junitxml=ci_artifacts/health_check/test-results.xml
      
      - name: Generate health check report
        run: |
          echo "Generating CI health check report..."
          
          # Create report
          cat > ci_artifacts/health_check/health_report.md << EOF
          # CI Health Check Report
          
          Generated on: $(date)
          
          ## Summary
          
          | Check | Status |
          |-------|--------|
          | Workflow Files | $(cat ci_artifacts/health_check/workflow_check.md | grep -q "Found 0 errors" && echo "✅ Pass" || echo "❌ Fail") |
          | Workflow Scripts | $(cat ci_artifacts/health_check/scripts_check.md | grep -q "Found 0 errors" && echo "✅ Pass" || echo "❌ Fail") |
          | External Services | $(cat ci_artifacts/health_check/external_services.md | grep -q "Found 0 failures" && echo "✅ Pass" || echo "❌ Fail") |
          | Minimal Tests | $([ -f ci_artifacts/health_check/test-results.xml ] && echo "✅ Pass" || echo "❌ Fail") |
          
          ## Details
          
          ### Workflow Files
          
          $(cat ci_artifacts/health_check/workflow_check.md | grep -v "^#")
          
          ### Workflow Scripts
          
          $(cat ci_artifacts/health_check/scripts_check.md | grep -v "^#")
          
          ### External Services
          
          $(cat ci_artifacts/health_check/external_services.md | grep -v "^#")
          
          ### Minimal Tests
          
          $([ -f ci_artifacts/health_check/test-results.xml ] && echo "Tests completed successfully." || echo "Tests failed to complete.")
          
          ## Recommendations
          
          - Address any failures identified in this report
          - Consider running a full CI test if minor issues are detected
          - Update external service dependencies if connectivity issues are found
          
          EOF
          
          # Copy to GitHub step summary
          cat ci_artifacts/health_check/health_report.md >> $GITHUB_STEP_SUMMARY
      
      - name: Upload health check artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-health-check-report
          path: ci_artifacts/health_check/
          retention-days: 30
      
      - name: Send notification on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Only run if SLACK_WEBHOOK_URL is set
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            python .github/workflows/scripts/send_notifications.py \
              --status failure \
              --slack \
              --slack-webhook "$SLACK_WEBHOOK_URL" \
              --artifacts-dir ci_artifacts
          else
            echo "SLACK_WEBHOOK_URL not set, skipping notification"
          fi
      
      - name: Set final status
        run: |
          # Check if any failures were detected
          workflow_failures=$(cat ci_artifacts/health_check/workflow_check.md | grep -q "Found 0 errors" || echo "true")
          script_failures=$(cat ci_artifacts/health_check/scripts_check.md | grep -q "Found 0 errors" || echo "true")
          external_failures=$(cat ci_artifacts/health_check/external_services.md | grep -q "Found 0 failures" || echo "true")
          test_failures=$([ -f ci_artifacts/health_check/test-results.xml ] || echo "true")
          
          if [ "$workflow_failures" == "true" ] || [ "$script_failures" == "true" ] || [ "$external_failures" == "true" ] || [ "$test_failures" == "true" ]; then
            echo "::warning::CI Health Check detected issues. See report for details."
            exit 1
          else
            echo "::notice::CI Health Check passed successfully."
            exit 0 