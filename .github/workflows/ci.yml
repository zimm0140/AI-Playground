# ==================================================================
# CI Workflow File:
#
# This GitHub Actions workflow is triggered on push and pull_request events to the main branch.
# It sets up an environment with Python 3.10, installs dependencies (including torch),
# and runs the test suite using Python's unittest framework.
# ==================================================================

name: CI

# --------------------------------------------------------------------
# Trigger Events:
# This workflow is triggered on push and pull_request events to the main branch.
# --------------------------------------------------------------------

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# --------------------------------------------------------------------
# Jobs Section:
# This section defines the jobs that run in the CI workflow.
# In this workflow, the 'test' job runs on ubuntu-latest and includes steps for:
# - Checking out the repository
# - Setting up Python 3.10
# - Installing dependencies (including torch)
# - Running the test suite
# --------------------------------------------------------------------

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f service/requirements.txt ]; then pip install -r service/requirements.txt; fi
          pip install yapf==0.40.2
      
      - name: Patch torch.xpu module for CI
        run: |
          echo "import torch" > sitecustomize.py
          echo "if hasattr(torch, 'xpu'):" >> sitecustomize.py
          echo "    if not hasattr(torch.xpu, 'has_fp64_dtype'):" >> sitecustomize.py
          echo "        torch.xpu.has_fp64_dtype = lambda: False" >> sitecustomize.py
      
      - name: Copy sitecustomize.py to site-packages
        run: cp sitecustomize.py $(python -c 'import site; print(site.getsitepackages()[0])')
      
      - name: Create intel_extension_for_pytorch stub
        run: |
          echo "# Dummy stub to satisfy intel_extension_for_pytorch import" > intel_extension_for_pytorch.py
          echo "# Provides minimal implementation for CI" >> intel_extension_for_pytorch.py
          echo "class IpexGradScaler:" >> intel_extension_for_pytorch.py
          echo "    def scale(self, loss): return loss" >> intel_extension_for_pytorch.py
          echo "    def step(self, optimizer): pass" >> intel_extension_for_pytorch.py
          echo "    def update(self): pass" >> intel_extension_for_pytorch.py
          echo "optimize = lambda model, dtype=None, inplace=False, **kwargs: model" >> intel_extension_for_pytorch.py
          echo "def quantization_aware_training(): return None" >> intel_extension_for_pytorch.py
          echo "def has_xpu(): return False" >> intel_extension_for_pytorch.py
          SITE_PACKAGES=$(python -c 'import site; print(site.getsitepackages()[0])')
          mkdir -p $SITE_PACKAGES/intel_extension_for_pytorch
          cp intel_extension_for_pytorch.py $SITE_PACKAGES/intel_extension_for_pytorch/__init__.py
      
      - name: Verify intel_extension_for_pytorch stub
        run: |
          python -c "import intel_extension_for_pytorch as ipex; print('Stub functions available:', dir(ipex)); print('has_xpu() returns:', ipex.has_xpu())"
          ls -la $(python -c 'import site; print(site.getsitepackages()[0])')/intel_extension_for_pytorch
      
      - name: Debug Python module paths
        run: python -c "import sys; print('Python module search paths:'); [print(f'- {p}') for p in sys.path]"
      
      - name: Lint code (yapf)
        run: yapf -R --diff .
      
      - name: Run tests
        env:
          PYTHONPATH: .
          PYTHONWARNINGS: "ignore"
        run: python -m unittest discover -s service/tests -v 