# ==================================================================
# CI Workflow File:
#
# This GitHub Actions workflow is triggered on push and pull_request events to the main branch.
# It sets up an environment with Python 3.10, installs dependencies (including torch),
# and runs the test suite using Python's unittest framework.
# ==================================================================

name: CI

# --------------------------------------------------------------------
# Trigger Events:
# This workflow is triggered on push and pull_request events to the main branch.
# --------------------------------------------------------------------

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# --------------------------------------------------------------------
# Jobs Section:
# This section defines the jobs that run in the CI workflow.
# In this workflow, the 'test' job runs on ubuntu-latest and includes steps for:
# - Checking out the repository
# - Setting up Python 3.10
# - Installing dependencies (including torch)
# - Running the test suite
# --------------------------------------------------------------------

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f service/requirements.txt ]; then pip install -r service/requirements.txt; fi
      
      - name: Patch torch.xpu module for CI
        run: |
          echo "import torch" > sitecustomize.py
          echo "if hasattr(torch, 'xpu'):" >> sitecustomize.py
          echo "    if not hasattr(torch.xpu, 'has_fp64_dtype'):" >> sitecustomize.py
          echo "        torch.xpu.has_fp64_dtype = lambda: False" >> sitecustomize.py
      
      - name: Copy sitecustomize.py to site-packages
        run: cp sitecustomize.py $(python -c 'import site; print(site.getsitepackages()[0])')
      
      - name: Create intel_extension_for_pytorch stub
        run: |
          echo "# Dummy stub to satisfy intel_extension_for_pytorch import" > intel_extension_for_pytorch.py
          echo "# Provides minimal implementation for CI" >> intel_extension_for_pytorch.py
          cp intel_extension_for_pytorch.py $(python -c 'import site; print(site.getsitepackages()[0])')
      
      - name: Run tests
        run: python -m unittest discover -s service/tests 