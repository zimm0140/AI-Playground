# ==================================================================
# CI Workflow File:
#
# This GitHub Actions workflow is triggered on push and pull_request events to the main branch.
# It sets up an environment with Python 3.10, installs dependencies (including torch),
# and runs the test suite using Python's unittest framework.
#
# Key features:
# - Creates mock Intel extension for PyTorch (intel_extension_for_pytorch) module
# - Patches imports to work in CI environment
# - Forces CPU-only mode for hardware-accelerated components
# - Uses a custom test runner with enhanced error handling
# - Provides detailed diagnostics of the environment
# - Continues workflow even if some tests fail due to CI limitations
# ==================================================================

name: CI

# --------------------------------------------------------------------
# Trigger Events:
# This workflow is triggered on push and pull_request events to the main branch.
# --------------------------------------------------------------------

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# --------------------------------------------------------------------
# Jobs Section:
# This section defines the jobs that run in the CI workflow.
# In this workflow, the 'test' job runs on ubuntu-latest and includes steps for:
# - Checking out the repository
# - Setting up Python 3.10
# - Installing dependencies (including torch)
# - Creating mock implementations of hardware-dependent modules
# - Patching code to work in CI environment
# - Running tests with comprehensive error handling
# - Running the test suite
# --------------------------------------------------------------------

jobs:
  cleanup:
    runs-on: ubuntu-latest
    name: Clean and Optimize
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Configure pip caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ${{ runner.os == 'Windows' && '~\AppData\Local\pip\Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          
      - name: Ensure script directory exists
        run: mkdir -p .github/workflows/scripts
      
      - name: Fix indentation issues in test files
        run: python .github/workflows/scripts/fix_ci_issues.py
      
      - name: Ensure unique artifact names
        run: python .github/workflows/scripts/ensure_unique_artifacts.py

  test:
    needs: cleanup
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: .uvcache
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Run CI setup script
        run: |
          python .github/workflows/scripts/ci_setup.py
      
      - name: Set up environment with uvfast
        run: python uvfast.py setup --hardware base --dev
      
      - name: Run tests
        run: python uvfast.py run pytest
      
      - name: Lint code
        run: python uvfast.py run ruff check .
  
  # Example of hardware-specific testing on self-hosted runner
  # Uncomment and configure when self-hosted runners are available
  # test-hardware:
  #   runs-on: [self-hosted, intel-arc]
  #   steps:
  #     - uses: actions/checkout@v4
  #     
  #     - name: Set up environment with hardware detection
  #       run: python uvfast.py setup --dev
  #     
  #     - name: Run hardware-specific tests
  #       run: python uvfast.py run pytest tests/hardware/

      - name: Upload tool compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-compatibility-report-${{ matrix.python-version }}
          path: ci_artifacts/tool_compat/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results/
          retention-days: 5

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: coverage/
          retention-days: 5

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results/
          retention-days: 5

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.python-version }}
          path: dist/
          retention-days: 30

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.python-version }}
          path: release/
          retention-days: 30
