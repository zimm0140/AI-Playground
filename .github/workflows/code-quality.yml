name: Code Quality

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/scripts/**'
      - 'tests/**'
      - '**.py'
      - '**.md'
      - '.pre-commit-config.yaml'
      - 'mypy.ini'
      - '.markdownlint.yaml'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/scripts/**'
      - 'tests/**'
      - '**.py'
      - '**.md'
      - '.pre-commit-config.yaml'
      - 'mypy.ini'
      - '.markdownlint.yaml'
      - '.github/workflows/code-quality.yml'

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install markdownlint
        run: npm install -g markdownlint-cli2
      - name: Create markdown fix script
        run: |
          cat > fix_markdown_advanced.py << 'EOF'
          #!/usr/bin/env python3
          """
          Advanced Markdown Linter Fix Script
          
          This script automatically fixes common markdown linting issues detected by markdownlint,
          with special handling for:
          1. Ordered list numbering (MD029)
          2. Multiple consecutive blank lines (MD012)
          3. Line length issues (MD013)
          4. Tables not surrounded by blank lines (MD058)
          5. List marker spacing (MD030)
          """
          
          import os
          import re
          import sys
          import glob
          from typing import List
          
          # Maximum line length (from .markdownlint.yaml)
          MAX_LINE_LENGTH = 180
          
          def fix_trailing_spaces(content: str) -> str:
              """Remove trailing whitespace from lines (MD009)."""
              return re.sub(r'[ \t]+$', '', content, flags=re.MULTILINE)
          
          def fix_consecutive_blank_lines(content: str) -> str:
              """Reduce multiple consecutive blank lines to a single blank line (MD012)."""
              return re.sub(r'\n{3,}', '\n\n', content)
          
          def fix_heading_spacing(content: str) -> str:
              """Ensure correct spacing around headings (MD022, MD023)."""
              # Add blank line before headings unless it's at the start of the document
              content = re.sub(r'([^\n])\n(#{1,6} )', r'\1\n\n\2', content)
              # Add blank line after headings unless it's at the end of the document
              content = re.sub(r'(#{1,6} .*)\n([^\n])', r'\1\n\n\2', content)
              # Remove space between # and heading text
              content = re.sub(r'(#{1,6})[ ]{2,}', r'\1 ', content)
              return content
          
          def fix_heading_punctuation(content: str) -> str:
              """Remove trailing punctuation in headings (MD026)."""
              # Replace trailing punctuation in headings
              return re.sub(r'^(#{1,6}\s+.*?)[.,;:!。，；：！](\s*)$', r'\1\2', content, flags=re.MULTILINE)
          
          def fix_ordered_lists(content: str) -> str:
              """Fix ordered list numbering to use consistent style (MD029)."""
              lines = content.splitlines()
              result = []
              in_list = False
              list_indentation = 0
              counter = 0
              
              for line in lines:
                  # Check for ordered list items using regex
                  list_match = re.match(r'^(\s*)(\d+)\.(\s.*)$', line)
                  
                  if list_match:
                      indentation = len(list_match.group(1))
                      content_after_dot = list_match.group(3)
                      
                      # If this is a new list or different indentation level
                      if not in_list or indentation != list_indentation:
                          in_list = True
                          list_indentation = indentation
                          counter = 1
                      else:
                          counter += 1
                      
                      # Replace with consistent numbering (1.)
                      result.append(f"{' ' * indentation}1.{content_after_dot}")
                  else:
                      # If line is empty and we're in a list, we might be ending the list
                      if not line.strip() and in_list:
                          in_list = False
                          list_indentation = 0
                          counter = 0
                      result.append(line)
              
              return '\n'.join(result)
          
          def fix_list_marker_spacing(content: str) -> str:
              """Fix spacing after list markers (MD030)."""
              # Fix unordered list spacing
              content = re.sub(r'^(\s*)([*+-])(\s{2,})', r'\1\2 ', content, flags=re.MULTILINE)
              # Fix ordered list spacing
              content = re.sub(r'^(\s*)(\d+\.)(\s{2,})', r'\1\2 ', content, flags=re.MULTILINE)
              return content
          
          def fix_code_blocks(content: str) -> str:
              """Ensure code blocks use consistent style (MD046, MD048)."""
              # Convert indented code blocks to fenced code blocks
              content = re.sub(r'(?<!\n\n)(?<!\n```)\n(( {4,}|\t).*\n)+', 
                               lambda m: f"\n```\n{re.sub(r'^ {4}', '', m.group(0), flags=re.MULTILINE)}```\n", 
                               content)
              # Add language to code blocks that don't have one (MD040)
              content = re.sub(r'```\n', '```text\n', content)
              # Ensure blank lines around fenced code blocks (MD031)
              content = re.sub(r'([^\n])(\n```)', r'\1\n\2', content)
              content = re.sub(r'(```\n)([^\n])', r'\1\n\2', content)
              return content
          
          def fix_table_spacing(content: str) -> str:
              """Ensure tables are surrounded by blank lines (MD058)."""
              # Add blank line before tables
              content = re.sub(r'([^\n])\n(\|[^|]*\|.*\n\|[-:| ]+\|)', r'\1\n\n\2', content)
              # Add blank line after tables
              content = re.sub(r'(\|[^|]*\|.*\n)\n([^\n])', r'\1\n\n\2', content)
              return content
          
          def ensure_trailing_newline(content: str) -> str:
              """Ensure file ends with exactly one newline (MD047)."""
              return content.rstrip('\n') + '\n'
          
          def fix_bare_urls(content: str) -> str:
              """Fix bare URLs by wrapping them in angle brackets (MD034)."""
              # Find URLs that are not part of markdown links or angle brackets
              url_pattern = r'(?<!\]\()(?<!\<)(https?://[^\s<>]+)(?!\>)'
              return re.sub(url_pattern, r'<\1>', content)
          
          def fix_markdown_file(file_path: str) -> bool:
              """Apply all fixes to a markdown file."""
              try:
                  with open(file_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  original_content = content
                  
                  # Apply fixes in a specific order
                  content = fix_trailing_spaces(content)
                  content = fix_consecutive_blank_lines(content)
                  content = fix_heading_spacing(content)
                  content = fix_heading_punctuation(content)
                  content = fix_ordered_lists(content)
                  content = fix_list_marker_spacing(content)
                  content = fix_table_spacing(content)
                  content = fix_code_blocks(content)
                  content = fix_bare_urls(content)
                  content = ensure_trailing_newline(content)
                  
                  # Write changes if needed
                  if content != original_content:
                      with open(file_path, 'w', encoding='utf-8') as f:
                          f.write(content)
                      print(f"✅ Fixed linting issues in {file_path}")
                      return True
                  else:
                      print(f"✓ No fixable issues found in {file_path}")
                      return False
              except Exception as e:
                  print(f"❌ Error processing {file_path}: {str(e)}")
                  return False
          
          def find_markdown_files(path: str) -> List[str]:
              """Find all markdown files in the given path."""
              if os.path.isfile(path) and path.lower().endswith('.md'):
                  return [path]
              
              if os.path.isdir(path):
                  md_files = glob.glob(os.path.join(path, '**/*.md'), recursive=True)
                  return md_files
              
              return []
          
          def main():
              """Main function to process directories or files."""
              path = "." if len(sys.argv) < 2 else sys.argv[1]
              
              md_files = find_markdown_files(path)
              if not md_files:
                  print(f"🔍 No markdown files found in {path}")
                  return
              
              print(f"\n🔍 Found {len(md_files)} markdown files")
              
              fixed_count = 0
              for file_path in md_files:
                  if fix_markdown_file(file_path):
                      fixed_count += 1
              
              print(f"\n✅ Fixed issues in {fixed_count} files")
          
          if __name__ == "__main__":
              main()
          EOF
      - name: Run markdown fixer
        run: python fix_markdown_advanced.py
      - name: Check for markdown linting issues
        run: markdownlint-cli2 "**/*.md" --config .markdownlint.yaml || true
      - name: Commit changes if any
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Fix markdown linting issues [skip ci]"
          git push

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
      - name: Run Ruff
        run: |
          ruff check --output-format=github .github/workflows/scripts/
          ruff check --output-format=github tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy pytest numpy
          # Install additional dependencies needed for imports
          pip install torch jsonschema
      - name: Run mypy
        run: mypy --ignore-missing-imports .github/workflows/scripts/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov numpy
          # Install dependencies needed for tests
          pip install torch jsonschema
      - name: Run tests
        run: |
          pytest tests/ -v
          
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run pre-commit on all files
        run: pre-commit run --all-files 