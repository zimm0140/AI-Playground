name: Code Quality

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/scripts/**'
      - 'tests/**'
      - '**.py'
      - '.pre-commit-config.yaml'
      - 'mypy.ini'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/scripts/**'
      - 'tests/**'
      - '**.py'
      - '.pre-commit-config.yaml'
      - 'mypy.ini'
      - '.github/workflows/code-quality.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
      - name: Run Ruff
        run: |
          ruff check --output-format=github .github/workflows/scripts/
          ruff check --output-format=github tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy pytest numpy
          # Install additional dependencies needed for imports
          pip install torch jsonschema
      - name: Run mypy
        run: mypy --ignore-missing-imports .github/workflows/scripts/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov numpy
          # Install dependencies needed for tests
          pip install torch jsonschema
      - name: Run tests
        run: |
          pytest tests/ -v
          
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run pre-commit on all files
        run: pre-commit run --all-files 
        
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v14
        with:
          globs: '**/*.md'
          config: '.markdownlint.yaml' 