name: ComfyUI PR Checks

on:
  pull_request:
    paths:
      - 'WebUI/external/workflows/**'

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    name: Validate ComfyUI Workflows in PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Needed to get file changes
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install argparse pyyaml numpy torch
          
      - name: Get changed files
        id: changed-files
        run: |
          # Get list of changed files in the PR
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} ${{ github.sha }} | tr '\n' ',' | sed 's/,$//g')
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "Found changed files: $CHANGED_FILES"
          
      - name: Create artifacts directory
        run: mkdir -p ci_artifacts/workflow_validation ci_artifacts/workflow_requirements ci_artifacts/workflow_tests ci_artifacts/workflow_versions ci_artifacts/workflow_dashboard ci_artifacts/workflow_simulation
          
      - name: Validate workflow JSON files
        run: |
          python .github/workflows/scripts/validate_comfyui_workflows.py \
            --workflows-dir WebUI/external/workflows \
            --output-dir ci_artifacts/workflow_validation
            
      - name: Analyze workflow requirements
        run: |
          python .github/workflows/scripts/analyze_workflow_requirements.py \
            --workflows-dir WebUI/external/workflows \
            --output-dir ci_artifacts/workflow_requirements
            
      - name: Simulate workflow execution
        run: |
          python .github/workflows/scripts/test_workflow_execution.py \
            --workflows-dir WebUI/external/workflows \
            --output-dir ci_artifacts/workflow_tests
            
      - name: Run model simulation on workflows
        run: |
          python .github/workflows/scripts/simulate_workflow_execution.py \
            --workflows-dir WebUI/external/workflows \
            --output-dir ci_artifacts/workflow_simulation
            
      - name: Track workflow versions
        run: |
          python .github/workflows/scripts/track_workflow_versions.py \
            --workflows-dir WebUI/external/workflows \
            --output-dir ci_artifacts/workflow_versions
            
      - name: Generate workflow dashboard
        run: |
          python .github/workflows/scripts/generate_workflow_dashboard.py \
            --validation-dir ci_artifacts/workflow_validation \
            --requirements-dir ci_artifacts/workflow_requirements \
            --tests-dir ci_artifacts/workflow_tests \
            --versions-dir ci_artifacts/workflow_versions \
            --workflows-dir WebUI/external/workflows \
            --components-dir WebUI/external/components \
            --output-dir ci_artifacts/workflow_dashboard
            
      - name: Generate PR comment
        run: |
          python .github/workflows/scripts/comment_on_workflow_pr.py \
            --validation-dir ci_artifacts/workflow_validation \
            --requirements-dir ci_artifacts/workflow_requirements \
            --tests-dir ci_artifacts/workflow_tests \
            --simulation-dir ci_artifacts/workflow_simulation \
            --versions-dir ci_artifacts/workflow_versions \
            --dashboard-dir ci_artifacts/workflow_dashboard \
            --changed-files ${{ steps.changed-files.outputs.changed_files }} \
            --output-file pr_comment.md
            
      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workflow-validation-artifacts
          path: ci_artifacts/
          retention-days: 5
          
      - name: Comment on PR
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('pr_comment.md', 'utf8');
            
            // Check if we already commented on this PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => {
              return comment.user.login === 'github-actions[bot]' && 
                     comment.body.includes('ComfyUI Workflow Validation Results');
            });
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
              console.log('Updated existing comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
              console.log('Created new comment');
            } 