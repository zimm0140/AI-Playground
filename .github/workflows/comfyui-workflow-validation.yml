name: ComfyUI Workflow Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'WebUI/external/workflows/**'
      - 'WebUI/external/components/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'WebUI/external/workflows/**'
      - 'WebUI/external/components/**'
  # Enable manual trigger
  workflow_dispatch:
  # Run weekly on Sunday at 00:00 UTC
  schedule:
    - cron: '0 0 * * 0'

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    name: Validate ComfyUI Workflows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install argparse pyyaml jsonschema
          
      - name: Create artifacts directory
        run: mkdir -p ci_artifacts/workflow_validation ci_artifacts/workflow_requirements ci_artifacts/workflow_tests ci_artifacts/workflow_versions ci_artifacts/workflow_dashboard ci_artifacts/workflow_docs ci_artifacts/component_validation
          
      # Schema validation (new step)
      - name: Validate workflow schema
        run: |
          python .github/workflows/scripts/validate_workflow_schema.py \
            --workflows-dir WebUI/external/workflows \
            --schema-file WebUI/external/schemas/workflow-schema.json \
            --output-file ci_artifacts/workflow_validation/schema_validation_report.json
          
      # Component validation (new step)
      - name: Validate components
        run: |
          python .github/workflows/scripts/validate_components.py \
            --components-dir WebUI/external/components \
            --output-dir ci_artifacts/component_validation
            
      # Original workflow validation
      - name: Validate workflow JSON files
        run: |
          python .github/workflows/scripts/validate_comfyui_workflows.py \
            --workflows-dir WebUI/external/workflows \
            --output-dir ci_artifacts/workflow_validation
            
      - name: Analyze workflow requirements
        run: |
          python .github/workflows/scripts/analyze_workflow_requirements.py \
            --workflows-dir WebUI/external/workflows \
            --output-dir ci_artifacts/workflow_requirements
            
      # Version validation (new step)
      - name: Check workflow versions
        run: |
          python .github/workflows/scripts/version_workflow.py \
            --workflows-dir WebUI/external/workflows \
            --check-breaking-changes
      
      # Generate documentation (new step)
      - name: Generate workflow documentation
        run: |
          python .github/workflows/scripts/generate_workflow_docs.py \
            --workflows-dir WebUI/external/workflows \
            --output-dir ci_artifacts/workflow_docs \
            --create-index \
            --create-gallery
            
      - name: Execute workflow tests
        run: |
          python .github/workflows/scripts/test_comfyui_workflows.py \
            --workflows-dir WebUI/external/workflows \
            --output-dir ci_artifacts/workflow_tests
            
      - name: Generate workflow versions
        run: |
          python .github/workflows/scripts/generate_workflow_versions.py \
            --workflows-dir WebUI/external/workflows \
            --output-dir ci_artifacts/workflow_versions
            
      - name: Generate workflow dashboard
        run: |
          python .github/workflows/scripts/generate_workflow_dashboard.py \
            --workflows-dir WebUI/external/workflows \
            --validation-dir ci_artifacts/workflow_validation \
            --requirements-dir ci_artifacts/workflow_requirements \
            --tests-dir ci_artifacts/workflow_tests \
            --versions-dir ci_artifacts/workflow_versions \
            --components-dir WebUI/external/components \
            --output-dir ci_artifacts/workflow_dashboard
            
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workflow-validation-artifacts
          path: ci_artifacts
          
      - name: Check validation result
        run: |
          if [ -f ci_artifacts/workflow_validation/validation_failed ]; then
            echo "Workflow validation failed. See artifacts for details."
            exit 1
          fi
          
      - name: Publish validation summary
        run: |
          echo "# ComfyUI Workflow Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
          
          # Create a separate Python script to generate the summary
          cat > generate_summary.py << EOF
#!/usr/bin/env python3
import json
import os
import sys

def main():
    # Check if validation results exist
    if os.path.exists('ci_artifacts/workflow_validation/workflow_validation_results.json'):
        with open('ci_artifacts/workflow_validation/workflow_validation_results.json', 'r') as f:
            results = json.load(f)
            
        with open(os.environ.get('GITHUB_STEP_SUMMARY', 'summary.md'), 'a') as summary:
            summary.write(f"Total workflows: {results['summary']['total_workflows']}\n\n")
            summary.write(f"Valid workflows: {results['summary']['valid_workflows']}\n\n")
            summary.write(f"Invalid workflows: {results['summary']['invalid_workflows']}\n\n")
            
            if results['summary']['invalid_workflows'] > 0:
                summary.write('### Invalid Workflows\n\n')
                for workflow in results['workflows']:
                    if not workflow['is_valid']:
                        issue_count = len(workflow['issues'])
                        summary.write(f"- **{workflow['filename']}**: {issue_count} issues\n\n")
    else:
        with open(os.environ.get('GITHUB_STEP_SUMMARY', 'summary.md'), 'a') as summary:
            summary.write("No validation results found\n\n")
    
    # Check if requirements results exist
    if os.path.exists('ci_artifacts/workflow_requirements/workflow_requirements_results.json'):
        with open('ci_artifacts/workflow_requirements/workflow_requirements_results.json', 'r') as f:
            results = json.load(f)
            
        with open(os.environ.get('GITHUB_STEP_SUMMARY', 'summary.md'), 'a') as summary:
            summary.write("## Requirements Analysis\n\n")
            summary.write(f"Analyzed workflows: {results['summary']['analyzed_workflows']} of {results['summary']['total_workflows']}\n\n")
            
            if 'models' in results['aggregate'] and results['aggregate']['models']:
                summary.write('### Top Models\n\n')
                sorted_models = sorted(results['aggregate']['models'].items(), key=lambda x: x[1], reverse=True)[:5]
                for model, count in sorted_models:
                    summary.write(f"- {model}: Used in {count} workflows\n\n")
            
            if 'custom_nodes' in results['aggregate'] and results['aggregate']['custom_nodes']:
                summary.write('### Top Custom Node Extensions\n\n')
                sorted_nodes = sorted(results['aggregate']['custom_nodes'].items(), key=lambda x: x[1], reverse=True)[:5]
                for node, count in sorted_nodes:
                    summary.write(f"- {node}: Used in {count} workflows\n\n")
    else:
        with open(os.environ.get('GITHUB_STEP_SUMMARY', 'summary.md'), 'a') as summary:
            summary.write("## Requirements Analysis\n\n")
            summary.write("No requirements analysis results found\n\n")

if __name__ == "__main__":
    main()
EOF

          # Execute the Python script
          python generate_summary.py 