name: Hardware Detection Testing

on:
  push:
    paths:
      - "hardware_detection/**"
      - ".github/workflows/hardware-detection.yml"
  pull_request:
    paths:
      - "hardware_detection/**"
      - ".github/workflows/hardware-detection.yml"

env:
  PYTHONPATH: ${{ github.workspace }}
  CI_TESTING: "true"
  SIMULATED_HARDWARE: "base"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # Include Ubuntu for future cross-platform support
          - os: ubuntu-latest
            python-version: "3.12"
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov types-requests mypy ruff
          pip install -e .
        shell: pwsh

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov types-requests mypy ruff
          pip install -e .
        shell: bash

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pytest -v hardware_detection/tests/ --cov=hardware_detection --cov-report=term-missing --import-mode=append
        shell: pwsh

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pytest -v hardware_detection/tests/ --cov=hardware_detection --cov-report=term-missing --import-mode=append
        shell: bash

  docker-tests:
    name: Docker Tests
    runs-on: windows-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Desktop
        uses: crazy-max/ghaction-setup-docker@v2
        with:
          version: latest

      - name: Build test image
        run: |
          docker build -t hardware-detection:test -f hardware_detection/Dockerfile .
        shell: pwsh

      - name: Run tests in container
        run: |
          docker run --rm hardware-detection:test pytest -v /app/hardware_detection/tests/
        shell: pwsh

  integration-test:
    name: Integration Test
    runs-on: windows-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov types-requests mypy ruff
          pip install -e .
        shell: pwsh

      - name: Run integration tests
        env:
          SIMULATED_HARDWARE: "acm"
        run: |
          python -m pytest -v hardware_detection/tests/test_detection.py::test_detect_hardware_type_acm
        shell: pwsh
