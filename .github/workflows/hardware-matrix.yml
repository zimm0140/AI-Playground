name: Hardware Matrix Testing

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/hardware/**'
      - '.github/workflows/hardware-matrix.yml'
      - '.github/workflows/scripts/**'
  push:
    branches: [main, release-*]
    paths:
      - 'tools/hardware/**'
      - '.github/workflows/hardware-matrix.yml'
      - '.github/workflows/scripts/**'

jobs:
  hardware-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.10']
        hardware: ['base', 'acm', 'ovino']
    
    env:
      PYTHONPATH: ${{ github.workspace }}
      SIMULATED_HARDWARE: ${{ matrix.hardware }}
      UVFAST_MOCK_DIR: ${{ github.workspace }}/.uvfast/mock

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
      
      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      
      - name: Set up hardware simulation environment
        run: |
          # Run the CI hardware setup script
          python .github/workflows/scripts/ci_hardware_setup.py --hardware-type ${{ matrix.hardware }}
          
          # Verify the environment was set up correctly
          echo "Simulated hardware type: ${{ matrix.hardware }}"
          echo "UVFAST_MOCK_DIR: ${{ env.UVFAST_MOCK_DIR }}"
          ls -la .uvfast/mock || dir .uvfast\mock
        shell: bash
      
      - name: Verify hardware detection setup
        run: |
          # Run the verification script
          python .github/workflows/scripts/verify_hardware_detection.py
        shell: bash
      
      - name: Run hardware detection tests
        run: |
          # Debug environment
          echo "Environment variables:"
          echo "SIMULATED_HARDWARE=${{ env.SIMULATED_HARDWARE }}"
          echo "UVFAST_MOCK_DIR=${{ env.UVFAST_MOCK_DIR }}"
          
          # Run the hardware detection script
          python tools/hardware/hardware_detection.py --verbose
          
          # Run tests
          pytest -xvs tests/hardware/
        shell: bash

      - name: Verify detection result
        run: |
          echo "Verifying hardware detection results"
          # Explicitly set environment variables to ensure they're available
          export SIMULATED_HARDWARE=${{ matrix.hardware }}
          export UVFAST_MOCK_DIR=${{ github.workspace }}/.uvfast/mock
          
          DETECTED=$(python -c "from tools.hardware.hardware_detection import detect_hardware_type; print(detect_hardware_type())")
          echo "Detected hardware: $DETECTED"
          echo "Expected hardware: ${{ matrix.hardware }}"
          
          if [ "$DETECTED" != "${{ matrix.hardware }}" ]; then
            echo "::error::Expected hardware type ${{ matrix.hardware }} but got $DETECTED"
            exit 1
          fi
        shell: bash

  # Additional job for lockfile validation
  validate-lockfiles:
    runs-on: ubuntu-latest
    # Only run this job if the hardware-matrix job succeeds
    needs: hardware-matrix
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Create essential files
        run: |
          # Create requirements files and directories if they don't exist
          mkdir -p service
          touch requirements.txt requirements-dev.txt
          touch requirements-hardware-base.txt requirements-hardware-ovino.txt
          touch service/requirements-acm.txt service/requirements-bmg.txt 
          touch service/requirements-mtl.txt service/requirements-lnl.txt
          touch service/requirements-arl_h.txt
          
          # Create initial empty lockfiles if they don't exist
          for req in requirements.lock requirements-dev.lock requirements-hardware-base.lock \
                     requirements-hardware-acm.lock requirements-hardware-bmg.lock \
                     requirements-hardware-mtl.lock requirements-hardware-lnl.lock \
                     requirements-hardware-ovino.lock requirements-hardware-arl_h.lock; do
            if [ ! -f "$req" ]; then
              echo "Creating empty lockfile: $req"
              echo "{}" > "$req"
            fi
          done
        shell: bash
      
      - name: Validate with uvfast if available
        run: |
          if [ -f "uvfast.py" ]; then
            # Install uv if needed
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            
            # Try to run uvfast lock command
            python uvfast.py lock --all || echo "Warning: uvfast.py lock command failed"
            
            # Don't fail the workflow, just warn if lockfiles are outdated
            if git diff --quiet requirements*.lock; then
              echo "Lockfiles are up to date"
            else
              echo "::warning::Lockfiles are not up to date."
              git diff requirements*.lock
            fi
          else
            echo "::warning::uvfast.py not found, skipping lockfile validation"
          fi
        shell: bash 