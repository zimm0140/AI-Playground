name: Hardware Matrix Testing

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/hardware/**'
      - '.github/workflows/hardware-matrix.yml'
      - '.github/workflows/scripts/hardware_env_setup.py'
  push:
    branches: [main, release-*]
    paths:
      - 'tools/hardware/**'
      - '.github/workflows/hardware-matrix.yml'
      - '.github/workflows/scripts/hardware_env_setup.py'

jobs:
  hardware-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.10']
        hardware: ['base', 'acm', 'ovino']
    
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
      
      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      
      - name: Set up hardware simulation environment
        run: |
          mkdir -p .uvfast/mock
          python .github/workflows/scripts/hardware_env_setup.py ${{ matrix.hardware }}
          # Verify the environment was set up correctly
          echo "Simulated hardware type: ${{ matrix.hardware }}"
          if [ "${{ matrix.hardware }}" != "base" ]; then
            echo "SIMULATED_HARDWARE=${{ matrix.hardware }}"
          fi
          ls -la .uvfast/mock || dir .uvfast\mock
        shell: bash

      - name: Install hardware-specific dependencies
        run: |
          if [ "${{ matrix.hardware }}" == "ovino" ]; then
            pip install openvino-dummy
          elif [ "${{ matrix.hardware }}" == "acm" ]; then
            pip install intel-gpu-stub
          fi
        shell: bash
      
      - name: Run hardware detection tests
        run: |
          # Set the environment variable for hardware simulation
          export SIMULATED_HARDWARE=${{ matrix.hardware }}
          
          # Run the hardware detection script
          python tools/hardware/hardware_detection.py --verbose
          
          # Run tests
          pytest -xvs tests/hardware/
        shell: bash

      - name: Verify detection result
        run: |
          echo "Verifying hardware detection results"
          export SIMULATED_HARDWARE=${{ matrix.hardware }}
          DETECTED=$(python -c "from tools.hardware.hardware_detection import detect_hardware_type; print(detect_hardware_type())")
          echo "Detected hardware: $DETECTED"
          if [ "$DETECTED" != "${{ matrix.hardware }}" ]; then
            echo "::error::Expected hardware type ${{ matrix.hardware }} but got $DETECTED"
            exit 1
          fi
        shell: bash

  # Additional job for lockfile validation
  validate-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Validate lockfiles
        run: |
          python uvfast.py lock --all
          if git diff --quiet requirements*.lock; then
            echo "Lockfiles are up to date"
          else
            echo "Lockfiles are not up to date. Please run 'python uvfast.py lock --all' and commit the changes."
            git diff requirements*.lock
            exit 1
          fi
        shell: bash 