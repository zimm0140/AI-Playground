name: Hardware Matrix Testing

# Trigger workflow on: workflow_dispatch, pull_request, or push to main
on:
  workflow_dispatch:
  pull_request:
    branches: [ main, release/* ]
    paths:
      - 'tools/hardware/**'
      - 'tests/hardware/**'
      - '.github/workflows/hardware-matrix.yml'
      - '.github/workflows/scripts/simple_hardware_ci.py'
  push:
    branches: [ main, release/* ]
    paths:
      - 'tools/hardware/**'
      - 'tests/hardware/**'
      - '.github/workflows/hardware-matrix.yml'
      - '.github/workflows/scripts/simple_hardware_ci.py'

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  hardware-detection-test:
    name: Test hardware detection
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']
        hardware-type: ['base', 'acm', 'ovino']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Set up hardware environment
        run: |
          # Run the simple hardware CI script to set up the environment
          python .github/workflows/scripts/simple_hardware_ci.py --hardware-type ${{ matrix.hardware-type }}
        
      - name: Run hardware detection tests
        run: |
          # Display environment for debugging
          echo "Python version: $(python --version)"
          echo "Current directory: $(pwd)"
          echo "Environment variable SIMULATED_HARDWARE: ${{ matrix.hardware-type }}"
          
          # Run the hardware detection script to verify detection
          python tools/hardware/hardware_detection.py
          
          # Run the actual tests
          pytest -xvs tests/hardware/test_hardware_detection.py
          
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: hardware-detection-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.hardware-type }}
          path: |
            tools/hardware/hardware_detection.py
            tests/hardware/test_hardware_detection.py
            .uvfast/mock/

  # Placeholder for lockfiles validation
  validate-lockfiles:
    runs-on: ubuntu-latest
    # Skip this job for now
    if: false
    steps:
      - name: Skipped
        run: echo "Lockfiles validation skipped"
        shell: bash 