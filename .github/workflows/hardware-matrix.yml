name: Hardware Detection Testing

# Disabled workflow
on:
  # Only allow manual trigger - remove all automatic triggers
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Tests
    # This will prevent the job from ever running
    if: false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11"]

  docker-test:
    name: Docker Tests
    if: false
    runs-on: ubuntu-latest
    needs: unit-test

  integration-test:
    name: Integration Test
    if: false
    runs-on: ubuntu-latest
    needs: docker-test
