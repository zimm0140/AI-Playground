name: Hardware Detection Testing

# Trigger workflow on: workflow_dispatch, pull_request, or push to main
on:
  workflow_dispatch:
  pull_request:
    branches: [main, release/*]
    paths:
      - "hardware_detection/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/hardware-matrix.yml"
      - "pyproject.toml"
      - "setup.py"
      - "uvfast.json"
  push:
    branches: [main, release/*]
    paths:
      - "hardware_detection/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/hardware-matrix.yml"
      - "pyproject.toml"
      - "setup.py"
      - "uvfast.json"

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # Unit tests without docker
  unit-test:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          python -m pytest hardware_detection/tests -v

  # Docker-based tests
  docker-test:
    name: Docker Tests
    runs-on: ubuntu-latest
    needs: unit-test

    strategy:
      fail-fast: false
      matrix:
        hardware-type: ["base", "acm", "ovino"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.hardware-type }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.hardware-type }}-

      - name: Create mock packages directory
        run: |
          mkdir -p hardware_detection/tests/mocks/intel-gpu-stub/intel_gpu
          mkdir -p hardware_detection/tests/mocks/openvino-dummy/openvino
          # Create Intel GPU mock package
          echo '"""Mock Intel GPU package for testing."""' > hardware_detection/tests/mocks/intel-gpu-stub/intel_gpu/__init__.py
          echo '__version__ = "1.0.0"' >> hardware_detection/tests/mocks/intel-gpu-stub/intel_gpu/__init__.py
          # Create setup.py for Intel GPU
          echo 'from setuptools import setup, find_packages' > hardware_detection/tests/mocks/intel-gpu-stub/setup.py
          echo 'setup(name="intel-gpu-stub", version="1.0.0", packages=find_packages())' >> hardware_detection/tests/mocks/intel-gpu-stub/setup.py
          # Create OpenVINO mock package
          echo '"""Mock OpenVINO package for testing."""' > hardware_detection/tests/mocks/openvino-dummy/openvino/__init__.py
          echo '__version__ = "2023.1.0"' >> hardware_detection/tests/mocks/openvino-dummy/openvino/__init__.py
          # Create setup.py for OpenVINO
          echo 'from setuptools import setup, find_packages' > hardware_detection/tests/mocks/openvino-dummy/setup.py
          echo 'setup(name="openvino-dummy", version="2023.1.0", packages=find_packages())' >> hardware_detection/tests/mocks/openvino-dummy/setup.py

      - name: Build and run Docker container
        run: |
          docker-compose build ${{ matrix.hardware-type }}
          docker-compose run ${{ matrix.hardware-type }}

      - name: Run tests in Docker
        run: |
          docker-compose build test
          docker-compose run -e SIMULATED_HARDWARE=${{ matrix.hardware-type }} test

  # Integration test with all containers
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: docker-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-integration-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-integration-

      - name: Create mock packages directory
        run: |
          mkdir -p hardware_detection/tests/mocks/intel-gpu-stub/intel_gpu
          mkdir -p hardware_detection/tests/mocks/openvino-dummy/openvino
          # Create Intel GPU mock package
          echo '"""Mock Intel GPU package for testing."""' > hardware_detection/tests/mocks/intel-gpu-stub/intel_gpu/__init__.py
          echo '__version__ = "1.0.0"' >> hardware_detection/tests/mocks/intel-gpu-stub/intel_gpu/__init__.py
          # Create setup.py for Intel GPU
          echo 'from setuptools import setup, find_packages' > hardware_detection/tests/mocks/intel-gpu-stub/setup.py
          echo 'setup(name="intel-gpu-stub", version="1.0.0", packages=find_packages())' >> hardware_detection/tests/mocks/intel-gpu-stub/setup.py
          # Create OpenVINO mock package
          echo '"""Mock OpenVINO package for testing."""' > hardware_detection/tests/mocks/openvino-dummy/openvino/__init__.py
          echo '__version__ = "2023.1.0"' >> hardware_detection/tests/mocks/openvino-dummy/openvino/__init__.py
          # Create setup.py for OpenVINO
          echo 'from setuptools import setup, find_packages' > hardware_detection/tests/mocks/openvino-dummy/setup.py
          echo 'setup(name="openvino-dummy", version="2023.1.0", packages=find_packages())' >> hardware_detection/tests/mocks/openvino-dummy/setup.py

      - name: Build and run all Docker containers
        run: |
          docker-compose build
          docker-compose up --no-log-prefix

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: hardware-detection-docker-artifacts
          path: |
            hardware_detection/
            docker/
            docker-compose.yml
