name: CI

# Trigger Events
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Enable manual trigger from the Actions tab
  workflow_dispatch:
  # Enable workflow reuse
  workflow_call:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10']
      # Don't cancel all matrix jobs if one fails
      fail-fast: false
    name: Linux Python ${{ matrix.python-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt', 'service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ matrix.python-version }}-pip-
      
      - name: Install dependencies
        # Install Python dependencies required for testing and CI process
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f service/requirements.txt ]; then pip install -r service/requirements.txt; fi
          pip install yapf==0.40.2
      
      - name: Set execution permissions for scripts
        run: |
          chmod +x .github/workflows/scripts/*.sh
          chmod +x .github/workflows/scripts/*.py
      
      - name: Profile CI performance
        # This helps identify bottlenecks in the CI process
        run: .github/workflows/scripts/profile_ci_performance.sh
      
      - name: Catalog hardware-specific dependencies
        run: .github/workflows/scripts/catalog_hardware.sh
      
      - name: Generate hardware compatibility matrix
        run: .github/workflows/scripts/generate_hardware_matrix.sh
      
      - name: Upload hardware support matrix
        uses: actions/upload-artifact@v3
        with:
          name: hardware-support-matrix-linux-${{ matrix.python-version }}
          path: ci_artifacts/hw_support.md
          retention-days: 90
      
      - name: Upload hardware compatibility matrix
        uses: actions/upload-artifact@v3
        with:
          name: hardware-compatibility-matrix-linux-${{ matrix.python-version }}
          path: ci_artifacts/hardware_matrix/
          retention-days: 90
      
      - name: Set GPU-related environment variables
        # Disable GPU/XPU access in CI environment
        run: |
          echo "CUDA_VISIBLE_DEVICES=-1" >> $GITHUB_ENV
          echo "CUDA_DEVICE_ORDER=PCI_BUS_ID" >> $GITHUB_ENV
          echo "XPU_VISIBLE_DEVICES=-1" >> $GITHUB_ENV
          echo "FORCE_CPU_ONLY=1" >> $GITHUB_ENV
          echo "Setting environment variables to disable GPU usage"
      
      - name: Create CPU mode patches
        run: .github/workflows/scripts/cpu_mode_patches.sh
      
      - name: Fix code issues for CI
        run: python .github/workflows/scripts/fix_ci_issues.py
      
      - name: Verify environment setup
        run: .github/workflows/scripts/verify_environment.sh
      
      - name: Check dependency updates
        # Check for outdated dependencies
        run: .github/workflows/scripts/check_dependency_updates.sh
      
      - name: Check requirements consistency
        run: python .github/workflows/scripts/check_requirements_consistency.py
      
      - name: Upload dependency report
        uses: actions/upload-artifact@v3
        with:
          name: dependency-report-linux-${{ matrix.python-version }}
          path: ci_artifacts/dependencies/
          retention-days: 30
      
      - name: Upload requirements consistency report
        uses: actions/upload-artifact@v3
        with:
          name: requirements-consistency-report-linux-${{ matrix.python-version }}
          path: ci_artifacts/requirements_check/
          retention-days: 30
      
      - name: Run code quality checks
        run: .github/workflows/scripts/check_code_quality.sh
      
      - name: Upload code quality report
        uses: actions/upload-artifact@v3
        with:
          name: code-quality-report-linux-${{ matrix.python-version }}
          path: |
            yapf_report.txt
            ci_artifacts/code_quality_summary.txt
          retention-days: 30
      
      - name: Run shell script checks
        run: .github/workflows/scripts/check_shell_scripts.sh
      
      - name: Upload shell script analysis
        uses: actions/upload-artifact@v3
        with:
          name: shell-lint-report-linux-${{ matrix.python-version }}
          path: ci_artifacts/shell_lint/
          retention-days: 30
      
      - name: Scan dependencies for security vulnerabilities
        run: .github/workflows/scripts/scan_dependencies.sh
      
      - name: Upload security scan results
        uses: actions/upload-artifact@v3
        with:
          name: security-report-linux-${{ matrix.python-version }}
          path: ci_artifacts/security/
          retention-days: 30
      
      - name: Run tests with custom test runner
        run: python .github/workflows/scripts/custom_test_runner.py
      
      - name: Analyze test coverage
        run: .github/workflows/scripts/analyze_test_coverage.sh
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-linux-${{ matrix.python-version }}
          path: ci_artifacts/coverage/
          retention-days: 30
      
      - name: Run Docker-based tests
        # Run tests in Docker for environment consistency
        if: contains(matrix.python-version, '3.10')  # Only run Docker tests on Python 3.10
        run: .github/workflows/scripts/docker_test.sh ${{ matrix.python-version }}
      
      - name: Upload Docker test results
        if: contains(matrix.python-version, '3.10')
        uses: actions/upload-artifact@v3
        with:
          name: docker-test-results-linux-${{ matrix.python-version }}
          path: ci_artifacts/docker/
          retention-days: 30
      
      - name: Generate workflow summary
        run: .github/workflows/scripts/generate_summary.sh
      
      - name: Check platform compatibility
        run: python .github/workflows/scripts/check_platform_compatibility.py
      
      - name: Upload platform compatibility report
        uses: actions/upload-artifact@v3
        with:
          name: platform-compatibility-report-linux-${{ matrix.python-version }}
          path: ci_artifacts/platform_checks/
          retention-days: 30
      
      - name: Upload performance profile
        uses: actions/upload-artifact@v3
        with:
          name: performance-report-linux-${{ matrix.python-version }}
          path: ci_artifacts/performance/
          retention-days: 30
      
      - name: Prepare notification message
        id: notification
        # Create a summary message for notifications
        run: |
          # Format a detailed message for notifications
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TITLE="CI Completed on PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          else
            TITLE="CI Completed on ${{ github.ref_name }}"
          fi
          
          MESSAGE=$(cat << EOF
          ### $TITLE
          
          | Category | Status |
          |----------|--------|
          | Environment Setup | ✅ Completed |
          | Code Quality | $(if [ -s yapf_report.txt ]; then echo "⚠️ Issues found"; else echo "✅ No issues"; fi) |
          | Hardware Support | ✅ Documented |
          | Tests | ✅ Completed |
          | Docker Tests | $(if [ -f ci_artifacts/docker/docker_coverage.xml ]; then echo "✅ Completed"; else echo "⏭️ Skipped"; fi) |
          | Security Scan | $(if [ -f ci_artifacts/security/main_requirements_scan.txt ]; then grep -q "vulnerability found" ci_artifacts/security/main_requirements_scan.txt && echo "⚠️ Issues found" || echo "✅ No issues"; fi) |
          | Performance | ✅ Profiled |
          
          [View Run Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
          )
          
          # Escape multiline string for GitHub Actions
          MESSAGE="${MESSAGE//'%'/'%25'}"
          MESSAGE="${MESSAGE//$'\n'/'%0A'}"
          MESSAGE="${MESSAGE//$'\r'/'%0D'}"
          
          # Use the new GITHUB_OUTPUT environment file instead of set-output
          echo "message=$MESSAGE" >> $GITHUB_OUTPUT
      
      # Notification steps are commented out but available when needed
      # - name: Send notification to Slack
      #   if: always()
      #   uses: slackapi/slack-github-action@v1.23.0
      #   with:
      #     payload: |
      #       ${{ steps.notification.outputs.message }}
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Generate compatibility report
        run: .github/workflows/scripts/generate_compatibility_report.sh ${{ matrix.python-version }}
      
      - name: Upload compatibility report
        uses: actions/upload-artifact@v3
        with:
          name: compatibility-report-linux-${{ matrix.python-version }}
          path: compatibility_report/
          retention-days: 90
      
      - name: Generate API documentation
        run: .github/workflows/scripts/generate_api_docs.sh
      
      - name: Generate API endpoints summary
        run: python .github/workflows/scripts/generate_api_summary.py
      
      - name: Upload API documentation
        uses: actions/upload-artifact@v3
        with:
          name: api-documentation-linux-${{ matrix.python-version }}
          path: api_docs/
          retention-days: 30
      
      - name: Upload API endpoints summary
        uses: actions/upload-artifact@v3
        with:
          name: api-endpoints-summary-linux-${{ matrix.python-version }}
          path: ci_artifacts/api_summary/
          retention-days: 30
      
      - name: Check tool compatibility
        run: .github/workflows/scripts/check_tool_compatibility.sh
      
      - name: Upload tool compatibility report
        uses: actions/upload-artifact@v3
        with:
          name: tool-compatibility-report-linux-${{ matrix.python-version }}
          path: ci_artifacts/tool_compat/
          retention-days: 30

  # Windows testing job - a simplified version of the Linux job
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10']  # Test only latest Python on Windows for speed
      fail-fast: false
    name: Windows Python ${{ matrix.python-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-python-${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt', 'service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ matrix.python-version }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path -Path "requirements.txt") { pip install -r requirements.txt }
          if (Test-Path -Path "service/requirements.txt") { pip install -r service/requirements.txt }
          pip install yapf==0.40.2 pytest pytest-cov
        shell: pwsh
      
      - name: Set environment variables
        run: |
          echo "CUDA_VISIBLE_DEVICES=-1" >> $env:GITHUB_ENV
          echo "CUDA_DEVICE_ORDER=PCI_BUS_ID" >> $env:GITHUB_ENV
          echo "XPU_VISIBLE_DEVICES=-1" >> $env:GITHUB_ENV
          echo "FORCE_CPU_ONLY=1" >> $env:GITHUB_ENV
        shell: pwsh
      
      - name: Run tests with custom test runner
        run: python .github/workflows/scripts/custom_test_runner.py
        shell: pwsh
      
      - name: Analyze test coverage on Windows
        run: |
          python -m pytest --cov=service --cov-report=xml:coverage.xml
          $coverage = [xml](Get-Content coverage.xml)
          $coveragePct = [math]::Round([double]$coverage.coverage.'line-rate' * 100, 2)
          "Windows test coverage: $coveragePct%"
          # Create summary for GitHub
          "## Windows Test Coverage" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Coverage | $coveragePct% |" >> $env:GITHUB_STEP_SUMMARY
        shell: pwsh
      
      - name: Check code quality
        run: |
          # Check for Python syntax errors
          Get-ChildItem -Path . -Filter "*.py" -Recurse -Exclude "venv" | ForEach-Object { python -m py_compile $_.FullName }
          
          # Run basic style check with yapf
          yapf --diff --recursive --exclude="venv/*" . | Set-Content -Path yapf_report.txt
        shell: pwsh
      
      - name: Upload code quality report
        uses: actions/upload-artifact@v3
        with:
          name: code-quality-report-windows-${{ matrix.python-version }}
          path: yapf_report.txt
          retention-days: 30
      
      - name: Generate compatibility report
        run: |
          mkdir -p compatibility_report
          
          @"
          # Windows Compatibility Report
          
          This report is automatically generated by the CI workflow to document compatibility with Windows.
          
          ## Matrix Test Information
          
          | Python Version | Status | Details |
          |----------------|--------|---------|
          | Python ${{ matrix.python-version }} | ✅ Current Run | [View Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          
          ## Platform Support
          
          | Platform | Status | Notes |
          |----------|--------|-------|
          | Windows | ✅ Tested | Successfully ran on Windows |
          
          Last updated: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
          
          *This is an automated report generated from workflow run #${{ github.run_number }}*
          "@ | Set-Content -Path compatibility_report/README.md
        shell: pwsh
      
      - name: Upload compatibility report
        uses: actions/upload-artifact@v3
        with:
          name: compatibility-report-windows-${{ matrix.python-version }}
          path: compatibility_report/
          retention-days: 90

  # macOS testing job - provides additional platform coverage
  test-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.10']  # Test only latest Python on macOS for speed
      fail-fast: false
    name: macOS Python ${{ matrix.python-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-python-${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt', 'service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ matrix.python-version }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f service/requirements.txt ]; then pip install -r service/requirements.txt; fi
          pip install pytest pytest-cov yapf==0.40.2
      
      - name: Set environment variables
        run: |
          echo "CUDA_VISIBLE_DEVICES=-1" >> $GITHUB_ENV
          echo "CUDA_DEVICE_ORDER=PCI_BUS_ID" >> $GITHUB_ENV
          echo "XPU_VISIBLE_DEVICES=-1" >> $GITHUB_ENV
          echo "FORCE_CPU_ONLY=1" >> $GITHUB_ENV
          echo "Setting environment variables to disable GPU usage"
      
      - name: Run tests with custom test runner
        run: python .github/workflows/scripts/custom_test_runner.py
      
      - name: Analyze test coverage on macOS
        run: |
          python -m pytest --cov=service --cov-report=xml:coverage.xml
          coverage_rate=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(round(float(root.attrib.get('line-rate', '0.0')) * 100, 2))")
          echo "macOS test coverage: $coverage_rate%"
          # Create summary for GitHub
          echo "## macOS Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | $coverage_rate% |" >> $GITHUB_STEP_SUMMARY
      
      - name: Check code quality
        run: |
          # Check for Python syntax errors
          find . -name "*.py" -not -path "*/venv/*" -exec python -m py_compile {} \;
          
          # Run basic style check with yapf
          yapf --diff --recursive --exclude="venv/*" . > yapf_report.txt
      
      - name: Upload code quality report
        uses: actions/upload-artifact@v3
        with:
          name: code-quality-report-macos-${{ matrix.python-version }}
          path: yapf_report.txt
          retention-days: 30
      
      - name: Generate compatibility report
        run: |
          mkdir -p compatibility_report
          
          cat > compatibility_report/README.md << EOF
          # macOS Compatibility Report
          
          This report is automatically generated by the CI workflow to document compatibility with macOS.
          
          ## Matrix Test Information
          
          | Python Version | Status | Details |
          |----------------|--------|---------|
          | Python ${{ matrix.python-version }} | ✅ Current Run | [View Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          
          ## Platform Support
          
          | Platform | Status | Notes |
          |----------|--------|-------|
          | macOS | ✅ Tested | Successfully ran on macOS |
          
          Last updated: $(date)
          
          *This is an automated report generated from workflow run #${{ github.run_number }}*
          EOF
      
      - name: Upload compatibility report
        uses: actions/upload-artifact@v3
        with:
          name: compatibility-report-macos-${{ matrix.python-version }}
          path: compatibility_report/
          retention-days: 90

  # Final job to summarize results from all platforms
  summarize:
    needs: [test-linux, test-windows, test-macos]
    runs-on: ubuntu-latest
    if: always()
    name: Summarize Results
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: Create summary
        run: |
          echo "# CI Summary Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Platform Test Matrix" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Python | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Add Linux results
          if [ "${{ needs.test-linux.result }}" == "success" ]; then
            echo "| Linux | 3.9 | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Linux | 3.10 | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-linux.result }}" == "failure" ]; then
            echo "| Linux | 3.9, 3.10 | :x: Failed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Linux | 3.9, 3.10 | :warning: Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Add Windows results
          if [ "${{ needs.test-windows.result }}" == "success" ]; then
            echo "| Windows | 3.10 | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-windows.result }}" == "failure" ]; then
            echo "| Windows | 3.10 | :x: Failed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Windows | 3.10 | :warning: Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Add macOS results
          if [ "${{ needs.test-macos.result }}" == "success" ]; then
            echo "| macOS | 3.10 | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-macos.result }}" == "failure" ]; then
            echo "| macOS | 3.10 | :x: Failed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| macOS | 3.10 | :warning: Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Overall Status" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.test-linux.result }}" == "success" ] && [ "${{ needs.test-windows.result }}" == "success" ] && [ "${{ needs.test-macos.result }}" == "success" ]; then
            echo "✅ All platform tests passed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Some platform tests failed or were skipped. See job details for more information." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Additional Features" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Feature | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Testing | ✅ Enabled |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Profiling | ✅ Enabled |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Updates | ✅ Enabled |" >> $GITHUB_STEP_SUMMARY
          echo "| Requirements Consistency | ✅ Enabled |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scanning | ✅ Enabled |" >> $GITHUB_STEP_SUMMARY
          echo "| API Endpoints Summary | ✅ Enabled |" >> $GITHUB_STEP_SUMMARY
          echo "| Hardware Compatibility Matrix | ✅ Enabled |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform Compatibility Check | ✅ Enabled |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Automation | ✅ Enabled |" >> $GITHUB_STEP_SUMMARY
          echo "| Cross-Platform Testing | ✅ Linux, Windows, macOS |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See individual platform artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY 