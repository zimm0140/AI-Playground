name: Markdown Linting

on:
  push:
    branches: [main, develop]
    paths:
      - "**.md"
  pull_request:
    branches: [main, develop]
    paths:
      - "**.md"
  workflow_dispatch:

jobs:
  fix-and-lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fix_markdown_all.py
        run: |
          python .github/workflows/scripts/fix_markdown_all.py

      - name: Check for changes
        id: diff-check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: steps.diff-check.outputs.changes == 'true'
        run: |
          git add .
          git commit -m "Auto-fix markdown issues [skip ci]"
          git push

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Run markdownlint
        run: markdownlint-cli2 "**/*.md" --config .markdownlint.yaml
