name: Fix Markdown Issues
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Run once a week on Monday

jobs:
  fix-markdown:
    name: Fix Markdown Issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mdformat
        shell: bash

      - name: Fix code blocks without language specifiers
        run: |
          python .github/workflows/scripts/fix_markdown_code_blocks.py
        shell: bash

      - name: Fix API reference markdown
        run: |
          python .github/workflows/scripts/fix_api_markdown.py
        shell: bash

      - name: Run mdformat on all markdown files
        run: |
          mdformat .
        shell: bash

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT
        shell: bash

      - name: Commit changes if any
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Fix markdown linting issues [skip ci]"
          git push
        shell: bash
