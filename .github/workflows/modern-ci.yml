name: Modern CI Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  PYTHONPATH: ${{ github.workspace }}
  CI_TESTING: "true"
  SIMULATED_HARDWARE: "base"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # Include Ubuntu for future cross-platform support
          - os: ubuntu-latest
            python-version: "3.12"
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov types-requests mypy ruff
          pip install -e .
        shell: pwsh

      - name: Run tests
        run: |
          python -m pytest -v hardware_detection/tests/ --cov=hardware_detection --cov-report=term-missing --import-mode=append
        shell: pwsh

    # Run integration test for hardware detection on main branch
    - name: Run hardware integration test
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        SIMULATED_HARDWARE: "acm"
      run: |
        python -m pytest -v hardware_detection/tests/test_detection.py::test_detect_hardware_type_acm
      shell: pwsh

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-requests pytest
          pip install -e .
        shell: pwsh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node.js dependencies
        run: |
          cd WebUI
          npm ci
        shell: pwsh

      - name: Lint Python
        run: |
          ruff check .
          ruff format --check .
          mypy hardware_detection
        shell: pwsh

      - name: Lint TypeScript
        run: |
          cd WebUI
          npm run lint:check
          npm run type-check
        shell: pwsh

      - name: Check markdown files
        run: |
          pip install mdformat
          mdformat --check .
        shell: pwsh

  audit:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit .
        shell: pwsh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Audit Node.js dependencies
        run: |
          cd WebUI
          npm audit
        shell: pwsh
