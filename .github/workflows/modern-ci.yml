name: Modern CI Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  PYTHONPATH: ${{ github.workspace }}
  CI_TESTING: "true"
  SIMULATED_HARDWARE: "base"

jobs:
  test:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # Include Ubuntu for future cross-platform support
          - os: ubuntu-latest
            python-version: "3.12"
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov types-requests mypy ruff
          pip install -e .
        shell: pwsh

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip
          # Install uv using pip instead of curl
          pip install uv
          pip install pytest pytest-cov types-requests mypy ruff
          pip install -e .
        shell: bash

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pytest -v hardware_detection/tests/ --cov=hardware_detection --cov-report=term-missing --import-mode=append
        shell: pwsh

      - name: Run tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pytest -v hardware_detection/tests/ --cov=hardware_detection --cov-report=term-missing --import-mode=append
        shell: bash

  docker-test:
    name: Docker Tests
    runs-on: ubuntu-latest # Changed to ubuntu-latest for better Docker support
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: |
          docker build -t hardware-detection:test -f hardware_detection/Dockerfile .
        shell: bash

      - name: Run tests in container
        run: |
          docker run --rm hardware-detection:test
        shell: bash

  integration-test:
    name: Hardware Integration Test
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov types-requests mypy ruff
          pip install -e .
        shell: pwsh

      - name: Run integration tests
        env:
          SIMULATED_HARDWARE: "acm"
        run: |
          python -m pytest -v hardware_detection/tests/test_detection.py::test_detect_hardware_type_acm
        shell: pwsh

  lint:
    name: Linting
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-requests pytest
          pip install -e .
        shell: pwsh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: WebUI/package-lock.json

      - name: Install Node.js dependencies
        run: |
          cd WebUI
          npm install --legacy-peer-deps
        shell: pwsh

      - name: Lint Python
        run: |
          ruff check .
          ruff format --check .
          mypy hardware_detection
        shell: pwsh

      - name: Lint TypeScript
        run: |
          cd WebUI
          npm run lint:check
          npm run format:check
          npm run type-check
        shell: pwsh

      - name: Check markdown files
        run: |
          pip install mdformat
          mdformat --check .
        shell: pwsh

  audit:
    name: Security Audit
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit .
        shell: pwsh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: WebUI/package-lock.json

      - name: Audit Node.js dependencies
        run: |
          cd WebUI
          npm audit || true  # Allow npm audit to fail
        shell: pwsh
