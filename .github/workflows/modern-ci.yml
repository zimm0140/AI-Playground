name: Modern CI Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  PYTHONPATH: ${{ github.workspace }}
  CI_TESTING: "true"
  SIMULATED_HARDWARE: "base"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Debug file structure
        run: |
          ls -la
          cat pyproject.toml
          cat README.md
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov types-requests mypy ruff hatch hatchling setuptools wheel build
          # Install in develop mode to avoid README issues
          python setup.py develop || python -m pip install -e .
        shell: bash

      - name: Verify installation
        run: |
          python -c "import hardware_detection; print(hardware_detection.__file__)"
          python -c "import hardware_detection; print(hardware_detection.__version__)"
        shell: bash

  test:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.10"
            shell: pwsh
          - os: windows-latest
            python-version: "3.11"
            shell: pwsh
          - os: windows-latest
            python-version: "3.12"
            shell: pwsh
          - os: ubuntu-latest
            python-version: "3.12"
            shell: bash
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov types-requests mypy ruff
          pip install -e .
        shell: pwsh

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov types-requests mypy ruff hatch hatchling setuptools wheel build
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev
          # Create a simplified setup.py if it doesn't exist
          if [ ! -f setup.py ]; then
            echo 'from setuptools import setup, find_packages; setup(name="hardware_detection", version="0.1.0", packages=find_packages(), install_requires=["typing-extensions>=4.0.0"])' > setup.py
          fi
          # Install in develop mode to avoid README issues
          python setup.py develop || python -m pip install -e .
        shell: bash

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pytest -v hardware_detection/tests/ --cov=hardware_detection --cov-report=term-missing --import-mode=append
        shell: pwsh

      - name: Run tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pytest -v hardware_detection/tests/ --cov=hardware_detection --cov-report=term-missing --import-mode=append -v
        shell: bash

  docker-test:
    name: Docker Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create README in hardware_detection directory
        run: |
          # Ensure README.md exists in the build context
          cp README.md hardware_detection/
          # Create pyproject.toml in hardware_detection directory
          echo '[build-system]
          requires = ["hatchling"]
          build-backend = "hatchling.build"

          [project]
          name = "hardware_detection"
          version = "0.1.0"
          description = "Hardware detection for testing"
          readme = "README.md"
          requires-python = ">=3.10"
          ' > hardware_detection/pyproject.toml
        shell: bash
      - name: Build and test Docker image
        run: |
          cd hardware_detection
          ls -la  # Debug: List files in directory
          docker buildx build --load -t hardware-detection-test .
          docker run --rm hardware-detection-test
        shell: bash

  integration-test:
    name: Hardware Integration Test
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov types-requests mypy ruff
          pip install -e .
        shell: pwsh

      - name: Run integration tests
        env:
          SIMULATED_HARDWARE: "acm"
        run: |
          python -m pytest -v hardware_detection/tests/test_detection.py::test_detect_hardware_type_acm
        shell: pwsh

  lint:
    name: Linting
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-requests pytest
          pip install -e .
        shell: pwsh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: WebUI/package-lock.json

      - name: Install Node.js dependencies
        run: |
          cd WebUI
          npm install --legacy-peer-deps
          npm install globals
        shell: pwsh

      - name: Lint Python
        run: |
          ruff check .
          ruff format --check .
          mypy hardware_detection
        shell: pwsh

      - name: Lint TypeScript
        run: |
          cd WebUI
          echo "Installing dependencies with explicit versions..."
          npm install --no-save eslint@8.56.0 eslint-plugin-vue@9.18.1 @typescript-eslint/eslint-plugin@6.18.1 @typescript-eslint/parser@6.18.1
          echo "Running lint check..."
          npx eslint . --config .eslintrc.js --ext .js,.ts,.vue || true
          echo "Running format check..."
          npm run format:check || true
          echo "Running type check..."
          npm run type-check || true
        shell: pwsh

      - name: Check markdown files
        run: |
          pip install mdformat
          mdformat --check .
        shell: pwsh

  audit:
    name: Security Audit
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit .
        shell: pwsh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: WebUI/package-lock.json

      - name: Audit Node.js dependencies
        run: |
          cd WebUI
          npm audit || true  # Allow npm audit to fail
        shell: pwsh
