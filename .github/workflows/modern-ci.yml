name: Modern CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHONPATH: ${{ github.workspace }}
  CI_TESTING: "true"
  SIMULATED_HARDWARE: "base"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11"]
        include:
          - python-version: "3.10"
            name: "Compatibility Testing"
          - python-version: "3.11"
            name: "Latest Features Testing"

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install traditional dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest pytest-cov pytest-mock types-requests
          python -m pip install -e .[test]
        shell: bash

      - name: Run CI setup script
        run: |
          python .github/workflows/scripts/ci_setup.py
        shell: bash

      - name: Verify hardware detection package
        run: |
          python -c "import hardware_detection; print(f'Version: {hardware_detection.__version__}')"
          python -c "import tools.hardware.hardware_detection; print(f'Compat Version: {tools.hardware.hardware_detection.__version__}')"
          python -c "from hardware_detection import detect_hardware_type; print(f'Hardware Type: {detect_hardware_type()}')"
        shell: bash

      - name: Run tests (traditional method)
        run: |
          python -m pytest -v tests/ --import-mode=append
        shell: bash

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        shell: bash
        if: runner.os != 'Windows'

      - name: Install uv (Windows)
        run: |
          iwr https://astral.sh/uv/install.ps1 -useb | iex
          echo "$env:LOCALAPPDATA\uv\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Cache uv packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            ~/.cache/uv/network
            ~/.cache/uv/source-archive
            ~/.cache/uv/resolution-db
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-
            ${{ runner.os }}-uv-

      - name: Test with uv (Unix)
        if: runner.os != 'Windows'
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install pytest pytest-cov pytest-mock types-requests
          uv pip install -e .[test]
          uv run pytest -v tests/ --import-mode=append
        shell: bash

      - name: Test with uv (Windows)
        if: runner.os == 'Windows'
        run: |
          uv venv
          .venv\Scripts\Activate.ps1
          uv pip install pytest pytest-cov pytest-mock types-requests
          uv pip install -e .[test]
          uv run pytest -v tests/ --import-mode=append
        shell: pwsh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install dependencies and run linting
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .[dev]
        shell: bash

      - name: Lint with Ruff
        run: |
          source .venv/bin/activate
          uv run ruff check .
        shell: bash

      - name: Type check with mypy
        run: |
          source .venv/bin/activate
          uv run mypy --python-version 3.10 --exclude '.github/workflows/scripts/*' .
        shell: bash

      - name: Check markdown files
        run: |
          npm install -g markdownlint-cli
          markdownlint '**/*.md' --ignore node_modules || true
        shell: bash

      - name: Fix markdown issues
        run: |
          python .github/workflows/scripts/fix_markdown_lint.py
          git diff --name-only
        shell: bash

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        shell: bash

      - name: Audit dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .
          uv pip audit
        shell: bash
        continue-on-error: true # Don't fail the build if vulnerabilities are found
