name: Modern CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
        include:
          - python-version: "3.10"
            name: "Compatibility Testing"
          - python-version: "3.13"
            name: "Latest Features Testing"

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install traditional dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run CI setup script
        run: |
          python .github/workflows/scripts/ci_setup.py

      - name: Run tests (traditional method)
        run: |
          python -m pytest

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache uv packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            ~/.cache/uv/network
            ~/.cache/uv/source-archive
            ~/.cache/uv/resolution-db
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-
            ${{ runner.os }}-uv-

      - name: Test with uv
        run: |
          uv venv
          uv pip install -e .
          uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies and run linting
        run: |
          # Create a virtual environment first
          uv venv
          # Activate the virtual environment
          source .venv/bin/activate
          # Install dependencies
          uv pip install ruff mypy types-requests pytest
          uv pip install -e .

      - name: Lint with Ruff
        run: |
          source .venv/bin/activate
          uv run ruff check .

      - name: Type check with mypy
        run: |
          source .venv/bin/activate
          uv run mypy --python-version 3.10 --exclude '.github/workflows/scripts/*' .

      - name: Check markdown files
        run: |
          npm install -g markdownlint-cli
          markdownlint '**/*.md' --ignore node_modules || true

      - name: Fix markdown issues
        run: |
          python .github/workflows/scripts/fix_markdown_lint.py
          git diff --name-only

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Audit dependencies
        run: |
          uv pip install -e .
          uv pip audit
        continue-on-error: true # Don't fail the build if vulnerabilities are found
