repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-ast
    -   id: check-json
    -   id: check-merge-conflict
    -   id: detect-private-key
    -   id: mixed-line-ending
        args: ['--fix=lf']

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.3
    hooks:
    -   id: ruff
        args: [--fix]
    -   id: ruff-format

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
    -   id: mypy
        additional_dependencies: [types-requests]
        args: [--ignore-missing-imports]
        files: ^hardware_detection/

-   repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
    -   id: prettier
        types_or: [javascript, jsx, ts, tsx, vue]
        additional_dependencies:
          - prettier@3.2.5
          - '@vue/eslint-config-prettier@8.0.0'
          - '@vue/eslint-config-typescript@12.0.0'

-   repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
    -   id: markdownlint
        args: ["--fix"]

-   repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
    -   id: eslint
        files: \.(js|ts|tsx)$
        types: [file]
        additional_dependencies:
          - eslint@8.56.0
          - typescript@5.3.3
          - "@typescript-eslint/eslint-plugin@6.19.1"
          - "@typescript-eslint/parser@6.19.1"

-   repo: local
    hooks:
    -   id: hardware-test
        name: hardware test
        entry: python -m uvfast.py hardware-check
        language: system
        types: [python]
        pass_filenames: false
        verbose: true

-   repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
    -   id: codespell
        args: ["--skip=*.lock,*.png,*.jpg,*.jpeg,*.webp,*.gif,*.ico,*.svg,*.woff,*.woff2,*.ttf,*.eot"]

# Run pytest on changed files
-   repo: local
    hooks:
    -   id: pytest-check
        name: pytest-check
        entry: python -m uvfast.py run pytest --no-header
        language: system
        types: [python]
        pass_filenames: false
        stages: [push]

# Docker linting
-   repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
    -   id: hadolint
        files: Dockerfile.*

ci:
    autofix_commit_msg: '[pre-commit.ci] Auto fixes from pre-commit hooks'
    autoupdate_schedule: weekly
    autoupdate_commit_msg: '[pre-commit.ci] Pre-commit autoupdate' 