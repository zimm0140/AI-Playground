repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.2
    hooks:
    -   id: ruff
        args: [--fix]
    -   id: ruff-format
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
        stages: [commit]
    -   id: end-of-file-fixer
        stages: [commit]
    -   id: check-yaml
        stages: [commit]
    -   id: check-json
        stages: [commit]
    -   id: check-added-large-files
        args: ['--maxkb=1000']
        stages: [commit]
    -   id: check-merge-conflict
        stages: [commit]
    -   id: debug-statements
        stages: [commit]
    -   id: detect-private-key
        stages: [commit] 