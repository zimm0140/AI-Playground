[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware_detection"
version = "0.1.0"
description = "Hardware detection utilities for AI Playground"
readme = { text = "Hardware detection module for ML workloads", content-type = "text/plain" }
requires-python = ">=3.9"
license = { text = "MIT License" }
keywords = ["hardware", "detection", "ml", "gpu"]
authors = [{ name = "Your Name", email = "your.email@example.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["typing-extensions>=4.8.0"]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-mock>=3.10.0"]
typecheck = ["mypy>=1.5.1"]
dev = ["ruff>=0.2.0", "types-requests>=2.31.0"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=append"
testpaths = ["hardware_detection/tests"]
pythonpath = ["."]

[tool.mypy]
# Python version to analyze
python_version = "3.10"

# Enable most strict settings
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Modern options
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
implicit_reexport = true
strict_optional = true

# Configure explicit module imports
ignore_missing_imports = true
follow_imports = "normal"

# Path-based exclusions
exclude = ["tests/", "venv/", ".venv/", "^docs/"]

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
# Target Python version
target-version = "py39"
line-length = 120

# Organize imports
[tool.ruff.lint.isort]
known-first-party = ["hardware_detection", "service"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

# Linting rules configuration
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "C90", # mccabe complexity
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
]

# Configure McCabe complexity checking
[tool.ruff.lint.mccabe]
max-complexity = 10

# Rules to ignore
ignore = [
    # Path handling issues - temporarily disabled
    "PTH101",
    "PTH102",
    "PTH103",
    "PTH104",
    "PTH107",
    "PTH110",
    "PTH118",
    "PTH119",
    "PTH120",
    "PTH122",
    "PTH123",
    "PTH202",
    "PTH100",
    "PTH207",
    "PTH112",
    "PTH113",
    "PTH109",
    "PTH105",

    # Security issues - temporarily disabled
    "S603",
    "S607",
    "S113",
    "S501",
    "S311",
    "S605",
    "S324",
    "S314",
    "S110",
    "S103",

    # Exception naming conventions
    "N818",

    # Variable and class naming conventions
    "N801",
    "N807",
    "N812",

    # Variable shadowing issues - temporarily disabled for backward compatibility
    "A001",
    "A002",

    # Mixed case variables - existing code style
    "N802",
    "N803",
    "N806",
    "N815",
    "N816",

    # Magic values - can be addressed in future refactoring
    "PLR2004",

    # Loop overwrite - harmless in this context
    "PLW2901",

    # Complex structure - to be addressed in future refactoring
    "C901",

    # Line too long - to be addressed in future refactoring
    "E501",

    # Code structure issues
    "SIM102",
    "SIM108",
    "SIM115",
    "SIM117",

    # Error handling
    "B904",

    # Import placement
    "E402",

    # Assignments and returns
    "RET504",
    "RET503",
    "RET505",

    # Unused variables
    "F841",

    # Unused loop control variables
    "B007",

    # Deprecated type annotations
    "UP006",
    "UP035",

    # Redefined while unused
    "F811",

    # Additional issues to ignore
    "F401", # unused-import
    "W291", # trailing-whitespace
    "F821", # undefined-name
]

# Per-file rule exceptions
[tool.ruff.lint.per-file-ignores]
"test*.py" = ["S101", "F401", "F403"]
"service/xpu_hijacks.py" = ["A001", "A002", "SIM102", "N802", "N816"]
"service/web_api.py" = ["N802", "N803", "N806", "A001"]
"service/web_request_bodies.py" = ["N815"]
"tools/formatting/*.py" = ["C901", "PLR0912"]
"tools/scripts/*.py" = ["F821"]
"tests/tools/hardware/hardware_detection.py" = [
    "I001",
    "E702",
    "PLE0605",
    "F403",
]

# Formatting options
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
