[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
strict_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
exclude = build/|dist/|node_modules/|\.git/|\.venv/|venv/|env/

[mypy.plugins.numpy.*]
follow_imports = skip

[mypy.plugins.torch.*]
follow_imports = skip

[mypy-service.*]
ignore_missing_imports = True

[mypy-intel_extension_for_pytorch]
ignore_missing_imports = True

[mypy-rag]
ignore_missing_imports = True

# Per-module options
[mypy.github.workflows.scripts.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy.tools.linting.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy.tools.apply_type_annotations]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy.tools.fix_docstring_indentation]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Ignore certain modules that we don't have types for
[mypy.requests.*]
ignore_missing_imports = True

[mypy.uvicorn.*]
ignore_missing_imports = True

[mypy.fastapi.*]
ignore_missing_imports = True

[mypy.pydantic.*]
ignore_missing_imports = True

[mypy.github.workflows.scripts.analyze_workflow_requirements]
disallow_untyped_defs = False
disallow_incomplete_defs = False
implicit_reexport = True 