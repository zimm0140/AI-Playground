[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-playground"
version = "2.2.0"
description = "AI Playground with compatibility for upstream merging"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "requests>=2.28.0",
    "flask>=2.2.0",
    "pillow>=9.3.0",
    "marshmallow-dataclass>=8.5.3",
    "langchain>=0.3.0",
    "compel>=2.0.0",
    "pytest>=7.3.1",
    "mypy>=1.3.0",
    "types-requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
    "mypy>=1.3.0",
    "ruff>=0.0.272",
    "pre-commit>=3.3.2",
    "markdownlint-cli>=0.35.0",
    "types-requests>=2.28.0",
]

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=7.3.1",
    "mypy>=1.3.0",
    "ruff>=0.0.272",
    "pre-commit>=3.3.2",
    "types-requests>=2.28.0",
]

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false  # Set to false initially to avoid too many errors
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true

# Exclude paths that don't need strict typing
[[tool.mypy.overrides]]
module = [".github.workflows.scripts.*"]
ignore_errors = true

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*" 