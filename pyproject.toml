[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-playground"
version = "2.2.1"
description = "A Python project for experimenting with AI technologies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI Playground Team", email = "example@example.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "requests>=2.28.0",
    "flask>=2.2.0",
    "pillow>=9.3.0",
    "marshmallow-dataclass>=8.5.3",
    "langchain>=0.3.0",
    "compel>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.1",
    "types-requests>=2.31.0.2",
    "pre-commit>=3.4.0",
]

# Hardware-specific dependencies
acm = [
    "intel-extension-for-pytorch>=2.3.0",
    "ipex-llm>=2.2.0b0",
    "mkl-dpcpp>=2024.0.0",
]

bmg = [
    "intel-extension-for-pytorch>=2.3.0",
    "ipex-llm>=2.2.0b0",
    "mkl-dpcpp>=2024.0.0",
]

mtl = [
    "intel-extension-for-pytorch>=2.3.0",
    "ipex-llm>=2.2.0b0",
    "mkl-dpcpp>=2024.0.0",
]

lnl = [
    "intel-extension-for-pytorch>=2.3.0",
    "ipex-llm>=2.2.0b0",
    "mkl-dpcpp>=2024.0.0",
]

ovino = [
    "openvino>=2025.1.0.dev20250203",
    "openvino-genai>=2025.1.0.0.dev20250203",
    "openvino-tokenizers>=2025.1.0.0.dev20250203",
]

[project.urls]
"Homepage" = "https://github.com/intel/AI-Playground"
"Bug Tracker" = "https://github.com/intel/AI-Playground/issues"

[tool.setuptools]
packages = ["service"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "W", "N", "B", "C4", "UP", "T20"]
ignore = ["E203"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.uv]
# uv-specific features for the pyproject.toml
no-binary = false
exclude-newer = []
link-mode = "copy"
compile-bytecode = true

[tool.uv.environments]
dev = { dependencies = ["pytest", "mypy", "ruff", "pre-commit"] }
