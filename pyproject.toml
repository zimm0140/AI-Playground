[tool.ruff]
# Enable specific rules
select = ["E", "F"]

# Ignore specific rules
ignore = [
    # Line too long
    "E501",
]

# Configure line length for when running format
line-length = 100

# Exclude a variety of commonly ignored directories
exclude = [
    ".git",
    ".github",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

# Assume Python 3.8
target-version = "py38"

[tool.ruff.per-file-ignores]
# Ignore unused imports in __init__.py files
"__init__.py" = ["F401"]
# Allow test files to import from parent directory
"tests/**.py" = ["E402"]

# Configure isort behavior
[tool.ruff.isort]
known-first-party = ["service"]

# Configure flake8 compatibility
[tool.ruff.flake8-quotes]
docstring-quotes = "double"
string-quotes = "double" 