[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hardware_detection"
version = "0.1.0"
description = "Hardware detection module for ML workloads"
readme = { text = "Hardware detection module for ML workloads", content-type = "text/plain" }
requires-python = ">=3.10"
license = "MIT"
keywords = ["hardware", "detection", "ml", "gpu"]
authors = [{ name = "Your Name", email = "your.email@example.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["typing-extensions>=4.0.0"]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "pytest-mock>=3.10.0"]
dev = ["ruff>=0.2.0", "mypy>=1.0.0", "types-requests>=2.31.0"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=append"
testpaths = ["hardware_detection/tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
# Target Python 3.10 code
target-version = "py310"
# Never enforce line length (handled by formatter)
line-length = 120

# Excluding certain directories
extend-exclude = [
    "venv",
    ".venv",
    "node_modules",
    "dist",
    "build",
    "__pycache__",
    "typings",
    ".git",
    ".pytest_cache",
    "WebUI/node_modules",
]

[tool.ruff.lint]
# Enable recommended rules
select = [
    "E",
    "F",
    "W",
    "I",
    "C90",
    "UP",
    "B",
    "N",
    "PL",
    "A",
    "C4",
    "SIM",
    "PTH",
]
# Ignore specific errors globally
ignore = ["E501", "PLR0913", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"hardware_detection/tests/conftest.py" = ["F811"]
"tests/hardware/conftest.py" = ["F811"]
"tests/**/conftest.py" = ["F811"]
"hardware_detection/core.py" = ["C901"]
"hardware_detection.py" = ["C901"]
"tools/scripts/uvfast.py" = ["C901"]
".github/workflows/scripts/*.py" = ["C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
