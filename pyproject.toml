[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware_detection"
version = "0.1.0"
description = "Hardware detection utilities for AI Playground"
readme = { text = "Hardware detection module for ML workloads", content-type = "text/plain" }
requires-python = ">=3.9"
license = { text = "MIT License" }
keywords = ["hardware", "detection", "ml", "gpu"]
authors = [{ name = "Your Name", email = "your.email@example.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["typing-extensions>=4.8.0"]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-mock>=3.10.0"]
typecheck = ["mypy>=1.5.1"]
dev = ["ruff>=0.2.0", "types-requests>=2.31.0"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=append"
testpaths = ["hardware_detection/tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "S",
    "C4",
    "B",
    "A",
    "COM",
    "C90",
    "RSE",
    "RET",
    "SIM",
    "PTH",
]
ignore = [
    # Path handling issues - temporarily disabled
    "PTH101",
    "PTH102",
    "PTH103",
    "PTH104",
    "PTH107",
    "PTH110",
    "PTH118",
    "PTH120",
    "PTH122",
    "PTH123",
    "PTH202",
    # Variable shadowing issues - temporarily disabled for backward compatibility 
    "A001",
    "A002",
    # Mixed case variables - existing code style
    "N802",
    "N803",
    "N806",
    "N815",
    "N816",
    # Magic values - can be addressed in future refactoring
    "PLR2004",
    # Loop overwrite - harmless in this context
    "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
"test*.py" = ["S101", "F401", "F403"]
"service/xpu_hijacks.py" = ["A001", "A002", "SIM102", "N802", "N816"]
"service/web_api.py" = ["N802", "N803", "N806", "A001"]
"service/web_request_bodies.py" = ["N815"]
"tools/formatting/*.py" = ["C901", "PLR0912"]
"tools/scripts/*.py" = ["F821"]
"tests/tools/hardware/hardware_detection.py" = [
    "I001",
    "E702",
    "PLE0605",
    "F403",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
