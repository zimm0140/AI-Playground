[uv]
# Populate the index cache when installing
cache-index = true

# Generate a lockfile when using uv pip compile
generate-lockfile = true

# Skip dependencies that have already been installed (faster installs)
skip-installed = true

# Prefer binary distributions over source distributions
prefer-binary = true

# Use hashed names for cache directories to avoid conflicts
hash-cache-directories = true

[resolver]
# Default resolution mode
resolution-mode = "highest"

# Allow prereleases when they're already installed (for upgrades)
allow-prereleases = false

[python]
# Allow using system Python toolchain
allow-system = true

[index]
# Specify pip index URL if needed
# url = "https://pypi.org/simple" 